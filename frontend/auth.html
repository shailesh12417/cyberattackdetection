<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberGuard — Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--fg);
    }
    .auth-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header svg {
      width: 48px;
      height: 48px;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    .auth-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
    }
    .auth-header p {
      color: var(--fg-muted);
      margin-top: 0.5rem;
      font-size: 0.875rem;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--fg);
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) - 4px);
      color: var(--fg);
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
    }
    .auth-btn {
      width: 100%;
      padding: 0.75rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: calc(var(--radius) - 4px);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 1rem;
    }
    .auth-btn:hover {
      background: #9333ea;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
    }
    .auth-links {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
    }
    .auth-links a {
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
    }
    .auth-links a:hover {
      color: #d8b4fe;
    }
    .hidden {
      display: none !important;
    }
    #authToast {
      position: absolute;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius);
      background: var(--card-bg);
      border: 1px solid var(--border);
      z-index: 50;
      transition: opacity 0.3s;
      opacity: 0;
      pointer-events: none;
    }
    #authToast.show {
      opacity: 1;
    }
    #authToast.error { border-color: var(--danger); color: var(--danger); }
    #authToast.success { border-color: var(--success); color: var(--success); }
  </style>
</head>
<body>
  <div id="authToast"></div>
  <div class="auth-container">
    <div class="auth-header">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
      </svg>
      <h1 id="authTitle">Sign In</h1>
      <p id="authSubtitle">Access your CyberGuard dashboard</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="loginUsername">Username</label>
        <input type="text" id="loginUsername" required placeholder="admin" />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" />
      </div>
      <button type="submit" class="auth-btn">Sign In</button>
      <div class="auth-links">
        Don't have an account? <a onclick="switchView('signup')">Sign up</a><br>
        <a onclick="switchView('reset')" style="margin-top: 0.5rem; display: inline-block;">Forgot password?</a>
      </div>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" class="hidden" onsubmit="handleSignup(event)">
      <div class="form-group">
        <label for="signupUsername">Username</label>
        <input type="text" id="signupUsername" required placeholder="admin" />
      </div>
      <div class="form-group">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" required placeholder="••••••••" />
      </div>
      <div class="form-group">
        <label for="signupPhrase">Security Phrase (For password reset)</label>
        <input type="text" id="signupPhrase" required placeholder="My secret phrase" />
      </div>
      <button type="submit" class="auth-btn">Create Account</button>
      <div class="auth-links">
        Already have an account? <a onclick="switchView('login')">Sign in</a>
      </div>
    </form>

    <!-- Reset Password Form -->
    <form id="resetForm" class="hidden" onsubmit="handleReset(event)">
      <div class="form-group">
        <label for="resetUsername">Username</label>
        <input type="text" id="resetUsername" required />
      </div>
      <div class="form-group">
        <label for="resetPhrase">Security Phrase</label>
        <input type="text" id="resetPhrase" required />
      </div>
      <div class="form-group">
        <label for="resetNewPassword">New Password</label>
        <input type="password" id="resetNewPassword" required />
      </div>
      <button type="submit" class="auth-btn">Reset Password</button>
      <div class="auth-links">
        Remembered your password? <a onclick="switchView('login')">Sign in</a>
      </div>
    </form>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <script>
    VANTA.NET({
      el: 'body',
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      scaleMobile: 1.00,
      color: 0xa855f7,
      backgroundColor: 0x0a0f1c
    });
  </script>
  <script src="assets/auth.js"></script>
</body>
</html>
